name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check generated client is up to date
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Integration tests (real Chrome)
        env:
          DESIGN_STUDIO_BROWSER: /usr/bin/google-chrome
        run: npm run test:integration
