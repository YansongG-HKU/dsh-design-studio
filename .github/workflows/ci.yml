name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check generated client is up to date
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Integration tests (real Chrome)
        run: |
          export DESIGN_STUDIO_BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          echo "browser=$DESIGN_STUDIO_BROWSER"
          npm run test:integration
